<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deposit - Top 4</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
}

.card {
  max-width: 500px;
  margin: 40px auto;
  background: #1e293b;
  padding: 30px;
  border-radius: 18px;
}

h1 {
  text-align: center;
}

.balance {
  text-align: center;
  color: #22c55e;
  font-size: 24px;
  font-weight: bold;
  margin: 20px 0;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
}

input,
select {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 9px;
  background: #334155;
  color: white;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  background: #22c55e;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.back {
  background: #475569;
}

.note {
  color: #cbd5e1;
  text-align: center;
  line-height: 1.5;
}

.message {
  text-align: center;
  margin-top: 15px;
  color: #facc15;
}
</style>
</head>

<body>

<div class="card">

<h1>Deposit</h1>

<div class="balance">
Wallet: <span id="wallet">0</span> UGX
</div>

<p class="note">
Deposits are added to your Wallet and can be used for machine purchases.
</p>

<label>Payment Method</label>

<select id="method">
  <option value="Airtel Money">Airtel Money</option>
  <option value="MTN Mobile Money">MTN Mobile Money</option>
</select>

<label>Amount (UGX)</label>

<input
  id="amount"
  type="number"
  min="1"
  placeholder="Enter amount"
>

<button onclick="deposit()">
Submit Deposit
</button>

<button
  class="back"
  onclick="window.location.href='account.html'">

Back to Account

</button>

<div id="message" class="message"></div>

</div>

<script>

let wallet =
Number(localStorage.getItem("top4Wallet")) || 0;

document.getElementById("wallet").textContent =
wallet.toLocaleString();


function deposit() {

  const amount =
    Number(document.getElementById("amount").value);

  const method =
    document.getElementById("method").value;

  const message =
    document.getElementById("message");


  if (!amount || amount <= 0) {

    message.textContent =
      "Enter a valid deposit amount.";

    return;
  }


  /*
    DEMO ONLY:
    This prototype credits the Wallet immediately.
    Real payment verification should be handled
    by a secure backend/payment provider.
  */

  wallet += amount;

  localStorage.setItem(
    "top4Wallet",
    wallet.toString()
  );


  const deposits =
    JSON.parse(
      localStorage.getItem("top4Deposits")
    ) || [];


  deposits.push({

    amount: amount,

    method: method,

    status: "Demo Approved",

    date: new Date().toISOString()

  });


  localStorage.setItem(
    "top4Deposits",
    JSON.stringify(deposits)
  );


  message.textContent =
    "Deposit recorded successfully.";


  document.getElementById("wallet")
    .textContent =
    wallet.toLocaleString();


  document.getElementById("amount").value = "";

}

</script>

</body>
</html>
